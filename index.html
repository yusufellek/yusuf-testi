<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bölüm 3</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
:root{--ink:#16120f;--paper:#f6efdc;--gold:#f3c94b;--muted:#b9b1c8;--sky:#cfe1f7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f0d12;color:var(--paper);font-family:'VT323',monospace;font-size:22px}
.wrap{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;font-family:'Pixelify Sans';font-size:12px;letter-spacing:.08em;color:var(--muted)}
.top select,.top button{font:inherit;color:var(--muted);background:#1b1822;border:2px solid #3a3446;padding:4px 6px;cursor:pointer;max-width:170px}
.stage{position:relative;flex:1;min-height:600px;margin:0 12px 12px;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3b3446;overflow:hidden;transition:background 1.4s,filter 1.4s}
.scene{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.part{font-family:'Pixelify Sans';font-size:11px;letter-spacing:.14em;color:var(--muted)}
.title{font-family:'Pixelify Sans';font-weight:600;font-size:14px;letter-spacing:.12em;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.narr{background:rgba(22,18,15,.8);border:3px solid var(--ink);padding:9px 12px;line-height:1.08;animation:fade .6s both}
.inner{color:#e9dfc6;font-style:normal;padding:2px 4px;line-height:1.08;animation:fade .6s both;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.inner::before{content:'› ';color:var(--gold)}
.btn{font-family:'VT323';font-size:22px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:7px 12px;cursor:pointer;align-self:flex-start;animation:fade .5s both}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.btn.ghost{background:var(--sky)}
.btn.gray{background:#cfcac2}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.spacer{flex:1;min-height:6px}
.tap{position:absolute;right:14px;bottom:12px;font-size:16px;color:var(--muted);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.big{font-family:'Pixelify Sans';font-size:20px;color:var(--gold);text-align:center;text-shadow:2px 2px 0 var(--ink);line-height:1.25;animation:fade .7s both}
.note{font-size:17px;color:var(--muted);text-align:center;animation:fade .6s both}
.clock{font-family:'Pixelify Sans';font-size:52px;color:var(--gold);text-shadow:3px 3px 0 var(--ink);text-align:center}
.chat{display:flex;flex-direction:column;gap:6px}
.b{max-width:82%;padding:6px 9px;border:2px solid var(--ink);line-height:1.05;font-size:20px;animation:fade .4s both}
.b.o{background:var(--paper);color:var(--ink);align-self:flex-start}
.b.m{background:var(--sky);color:var(--ink);align-self:flex-end}
.b.s{font-size:17px}
.typer{background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:9px;min-height:44px}
.cur{display:inline-block;width:10px;height:19px;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(2) infinite}
.phone{align-self:center;width:180px;background:#1b1b22;border:3px solid var(--ink);padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.phone .who{font-family:'Pixelify Sans';font-size:14px;color:#fff}
.ring{animation:ring .22s linear infinite alternate}
@keyframes ring{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.px{image-rendering:pixelated}
/* kar */
.snow{position:absolute;inset:0;pointer-events:none;z-index:0}
.snow i{position:absolute;top:-6px;width:4px;height:4px;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(640px)}}
.scene > *{position:relative;z-index:1}
.board{font-family:'Pixelify Sans';background:#0c0c0c;border:3px solid var(--ink);padding:8px 10px;color:#ffcf4a;font-size:14px;letter-spacing:.05em;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px}
.board .x{color:#ff5a5a;animation:blink 1s steps(2) infinite}
/* adam asmaca */
.hm{display:flex;gap:14px;align-items:center}
.gal{width:80px;height:100px;flex:0 0 auto}
.word{font-family:'Pixelify Sans';font-size:30px;letter-spacing:10px}
.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.keys button{font-family:'VT323';font-size:19px;background:var(--sky);border:2px solid var(--ink);padding:3px 0;cursor:pointer}
.keys button:disabled{opacity:.3}
/* müzik */
.player{background:#1b1822;border:3px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:10px;background:#3a3446;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width 6s linear}
.eq{display:flex;gap:3px;align-items:flex-end;height:26px}
.eq span{width:6px;background:var(--gold);animation:eq .6s ease-in-out infinite alternate}
@keyframes eq{from{height:4px}to{height:26px}}
/* görüntülü */
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:330px}
.frame{position:relative;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.frame .lab{position:absolute;top:6px;left:6px;font-family:'Pixelify Sans';font-size:11px;background:rgba(0,0,0,.6);padding:2px 5px;color:#fff;z-index:3}
.frame img{height:86%;position:relative;z-index:2;transition:filter 1s}
.frame.ist{background:linear-gradient(#3b4a5e,#6d7c8e)}
.frame.hel{background:linear-gradient(#1c2a44,#8aa4c2)}
.rain{position:absolute;inset:0;z-index:1}
.rain i{position:absolute;top:-20px;width:2px;height:14px;background:rgba(200,220,255,.7);animation:rain linear infinite}
@keyframes rain{to{transform:translate(-30px,360px)}}
.frame.dim img{filter:brightness(.35) saturate(.4)}
.store{position:absolute;bottom:0;right:0;width:60%;height:38%;background:#c9c2b3;border-top:3px solid var(--ink);z-index:1}
.store::before{content:'MARKET';position:absolute;top:6px;left:8px;font-family:'Pixelify Sans';font-size:10px;color:#a33}
.stop{position:absolute;bottom:0;left:6px;width:10px;height:62%;background:#222;z-index:1}
.stop::before{content:'';position:absolute;top:-12px;left:-12px;width:34px;height:18px;background:#e2b23a;border:2px solid var(--ink)}
/* pencere */
.wins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.win{height:150px;border:4px solid #0a0a0a;background:#101624;cursor:pointer;position:relative;transition:background 1s,box-shadow 1s}
.win::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;background:#0a0a0a}
.win.on{background:#f4c46b;box-shadow:0 0 40px rgba(244,196,107,.55)}
.win small{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:16px;color:var(--muted)}
/* gürültü */
.noise{position:relative;height:320px;border:3px dashed #3a3446}
.th{position:absolute;font-family:'VT323';font-size:20px;background:#2a2533;color:#f2ead7;border:2px solid var(--ink);padding:3px 7px;cursor:pointer;animation:pop .25s steps(3) both;white-space:nowrap}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
/* hikâye */
.story{height:250px;border:3px solid var(--ink);background:linear-gradient(135deg,#e9c9a0,#b98b6a,#7d5b6f);filter:blur(0);position:relative;overflow:hidden}
.story::before{content:'';position:absolute;inset:0;backdrop-filter:blur(10px);background:radial-gradient(circle at 50% 40%,rgba(255,240,220,.6),transparent 60%)}
.story .bar2{position:absolute;top:6px;left:6px;right:6px;height:4px;background:rgba(255,255,255,.4)}
.story .bar2 i{display:block;height:100%;width:0;background:#fff;animation:sb 6s linear forwards}
@keyframes sb{to{width:100%}}
.opt{display:flex;flex-direction:column;gap:8px;position:relative}
.opt .btn{align-self:stretch;text-align:left}
.ptr{position:absolute;width:22px;height:22px;transition:all 1.2s cubic-bezier(.4,0,.2,1);z-index:5;pointer-events:none}
/* takvim */
.cal{align-self:center;width:160px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);text-align:center}
.cal b{display:block;background:#a33;color:#fff;font-family:'Pixelify Sans';font-size:14px;padding:4px}
.cal span{display:block;font-family:'Pixelify Sans';font-size:44px;padding:8px}
.silence{font-family:'Pixelify Sans';font-size:15px;color:var(--muted);text-align:center}
.count{font-family:'Pixelify Sans';color:#ff8a94}
/* aynı kare */
.together{align-self:center;width:94%;border:3px solid var(--ink);background:linear-gradient(#2b2340,#6b4e63 70%,#3a2a2a);display:flex;justify-content:center;padding-top:30px;height:290px;position:relative;overflow:hidden}
.together img{height:100%;filter:brightness(.25) blur(2px);transition:filter 3s}
.together.on img{filter:none}
.final{font-family:'Pixelify Sans';font-size:18px;line-height:1.35;text-align:center;color:#f2ead7;text-shadow:2px 2px 0 var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>BÖLÜM 3</span><button id="restart">Baştan</button></div>
  <div class="stage" id="stage"></div>
</div>
<script>
const IMG = {sen:'sen.png', yusuf:'yusuf.png', birlikte:'kafe1.png'};
const stage = document.getElementById('stage');
const $ = s => stage.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
let i = 0, token = 0;
function bg(a, b, sat = 1){ stage.style.background = `linear-gradient(${a}, ${b})`; stage.style.filter = `saturate(${sat})`; }
function scene(part, title, html = ''){ token++; stage.innerHTML = `<div class="scene"><div class="part">${part}</div><div class="title">${title}</div>${html}</div>`; return stage.firstElementChild; }
const alive = t => t === token;
function add(sc, html){ if(!sc || !sc.isConnected) return document.createElement('div'); sc.insertAdjacentHTML('beforeend', html); sc.scrollTop = sc.scrollHeight; return sc.lastElementChild; }
// dokunarak ilerleyen satırlar
function lines(sc, arr, cls = 'inner'){
  return new Promise(res => {
    let k = 0; const t = token;
    const tip = document.createElement('div'); tip.className = 'tap'; tip.textContent = 'dokun ›'; stage.appendChild(tip);
    const step = () => { if(!alive(t)) return; if(k >= arr.length){ stage.removeEventListener('click', step); tip.remove(); res(); return; } add(sc, `<div class="${cls}">${arr[k++]}</div>`); };
    step();
    setTimeout(() => stage.addEventListener('click', step), 50);
  });
}
function nextBtn(sc, label = 'Devam'){ const b = add(sc, `<button class="btn ghost">${label}</button>`); b.onclick = e => { e.stopPropagation(); next(); }; }
function next(){ i = Math.min(i + 1, S.length - 1); go(); }
const S = [], N = [];
const P1 = 'BİRİNCİ KISIM · O ZAMANLAR', P2 = 'İKİNCİ KISIM · SOĞUMA', P3 = 'ÜÇÜNCÜ KISIM · HİKÂYE';

/* yardımcı: dokundukça mesajlar */
function talk(sc, arr){
  return new Promise(res => {
    let k = 0; const t = token;
    const tip = document.createElement('div'); tip.className = 'tap'; tip.textContent = 'dokun ›'; stage.appendChild(tip);
    const cls = {o:'b o', m:'b m', i:'inner', n:'narr', big:'big', note:'note', s:'silence'};
    const step = () => { if(!alive(t)) return; if(k >= arr.length){ stage.removeEventListener('click', step); tip.remove(); res(); return; }
      const [w, x] = arr[k++]; add(sc, `<div class="${cls[w]}">${x}</div>`); };
    step(); setTimeout(() => stage.addEventListener('click', step), 50);
  });
}
const time = (sc, t) => add(sc, `<div class="silence">${t}</div>`);

/* 1 Kar */
N.push('1. Kar'); S.push(async () => {
  bg('#1d2a44', '#4a5d80');
  const sc = scene(P1, 'HOLLANDA · KIŞ', `<div class="board"><span>AMS</span><span>→ HELSİNKİ</span><span class="x">İPTAL</span><span>AMS</span><span>→ OSLO</span><span class="x">İPTAL</span><span>AMS</span><span>→ BERLİN</span><span class="x">İPTAL</span></div>`);
  const sn = document.createElement('div'); sn.className = 'snow';
  sn.innerHTML = Array.from({length:70}, () => `<i style="left:${Math.random()*100}%;animation-duration:${3+Math.random()*4}s;animation-delay:${-Math.random()*6}s"></i>`).join('');
  sc.prepend(sn);
  await lines(sc, ['Sen Yusuf\'sun.', 'Havalimanındasın. Kar sabahtan beri durmadı.', 'Ekranda bütün uçuşlar kırmızı yanıyor.', 'Yeni uçuş yarın. Belki yarın.', 'Önünde koca bir gün var ve yapacak hiçbir şey yok.']);
  const b = add(sc, `<button class="btn">Telefonda bir oyun aç</button>`); b.onclick = e => { e.stopPropagation(); next(); };
});


/* 2 Adam asmaca */
N.push('2. Adam asmaca'); S.push(async () => {
  bg('#2b2340', '#5b4a6e');
  const sc = scene(P1, 'ADAM ASMACA · ÇEVRİMİÇİ', `
    <div class="narr">Rastgele biriyle eşleştin. Kelimeyi birlikte bulacaksınız. Her harfte sohbet biraz ilerliyor.</div>
    <div class="hm"><svg class="gal" viewBox="0 0 90 110"><path d="M8 105h50M20 105V8h40v14" stroke="#f6efdc" stroke-width="5" fill="none"/><g id="man" stroke="#f6efdc" stroke-width="4" fill="none"></g></svg><div class="word" id="w"></div></div>
    <div class="keys" id="keys"></div><div class="chat" id="chat"></div>`);
  const W = 'KAR', A = 'ABCÇDEFGHIİJKLMNOÖPRSŞTUÜVYZ'.split('');
  $('#keys').innerHTML = A.map(l => `<button>${l}</button>`).join('');
  const talk = [['o','Selam :)'],['m','Selam. Sen de mi sıkıldın?'],['o','Biraz. Nerelisin sen?'],['m','Hollanda\'da mahsur kaldım. Kar yüzünden uçuş iptal.'],['o','Aa, geçmiş olsun. Ben İstanbul\'dayım.'],['m','Ne iş yapıyorsun?'],['o','Hukuk bürosunda çalışıyorum. Sen?'],['m','Öğrenciyim, Helsinki\'de.'],['o','Helsinki mi? Orası soğuk değil mi?'],['m','Burası daha soğuk şu an :)']];
  const parts = ['<circle cx="60" cy="32" r="9"/>','<path d="M60 41v28"/>','<path d="M60 50l-12 10"/>','<path d="M60 50l12 10"/>','<path d="M60 69l-10 16"/>','<path d="M60 69l10 16"/>'];
  let got = new Set(), miss = 0, t = 0;
  const draw = () => $('#w').textContent = W.split('').map(c => got.has(c) ? c : '_').join('');
  draw();
  $('#keys').onclick = async e => {
    const b = e.target.closest('button'); if(!b) return; b.disabled = true;
    const l = b.textContent;
    if(W.includes(l)) got.add(l); else if(miss < parts.length) $('#man').insertAdjacentHTML('beforeend', parts[miss++]);
    draw();
    const n = Math.min(2, talk.length - t); for(let q = 0; q < n; q++){ const [w, m] = talk[t++]; add($('#chat'), `<div class="b ${w}">${m}</div>`); }
    sc.scrollTop = sc.scrollHeight;
    if(W.split('').every(c => got.has(c))){
      $('#keys').remove(); await wait(500);
      while(t < talk.length){ const [w, m] = talk[t++]; add($('#chat'), `<div class="b ${w}">${m}</div>`); sc.scrollTop = sc.scrollHeight; await wait(450); }
      add(sc, `<div class="narr">Kelime: KAR. Oyun bitti. Ekranın köşesinde küçük bir buton beliriyor.</div>`);
      const ad = add(sc, `<button class="btn">+ Arkadaş ekle</button>`);
      ad.onclick = async ev => {
        ev.stopPropagation(); ad.disabled = true; ad.textContent = 'Eklendi'; await wait(800);
        await lines(sc, ['Biliyorum, şaka gibi gelecek.', 'Ama onu eklediğim an bir şey hissettim.', 'Bir şey olmayabilirdi de.']);
        add(sc, `<div class="big">“Ama bir şey olacak gibi hissettim.”</div>`);
        nextBtn(sc);
      };
    }
  };
});


/* @@HAFTA */
N.push('3. Oyunda bir hafta'); S.push(async () => {
  bg('#2b2340', '#6b4e63');
  const sc = scene(P1, 'OYUNDA BİR HAFTA', `<div class="narr">Ertesi gün yine girdin. O da oradaydı. Sonraki gün de.</div>`);
  await talk(sc, [['i','Kelime bulmaktan çok konuşuyordunuz.'],['i','Oyunu açınca ilk iş onun çevrimiçi olup olmadığına bakıyordun.'],['i','Bir gün isimleri konuştunuz.'],['m','Senin adın nereden geliyor?'],['o','Bir şiir var. “Ömür Hanım.”'],['note','[bir şiir paylaştı]'],['i','Bir hafta böyle geçti.'],['i','Bu oyunda kalsın istemiyorsun. Onu gerçek hayatına taşımak istiyorsun.'],['i','Ama ya tuhaf kaçarsa?']]);
  writeAsk(sc);
});
function writeAsk(sc){
  add(sc, `<div class="typer"><span id="tt"></span><span class="cur"></span></div><div class="note" id="h">Her dokunuşta biraz yazılır.</div>`);
  const k = add(sc, `<button class="btn ghost">Yaz</button>`);
  const first = 'Başka bir yerden konuşsak', target = 'Başka bir yerden konuşsak mı? Numaranı alabilir miyim?';
  let step = 0, pos = 0, busy = false; const t = token;
  k.onclick = async e => {
    e.stopPropagation(); if(busy) return;
    if(step === 0){ pos += 2; $('#tt').textContent = first.slice(0, pos);
      if(pos >= first.length){ busy = true; $('#h').textContent = 'Parmağın gönder tuşunun üstünde duruyor...'; await wait(1200); if(!alive(t)) return; $('#h').textContent = 'Vazgeçiyorsun. Siliyorsun.';
        for(let p = pos; p >= 0; p--){ $('#tt').textContent = first.slice(0, p); await wait(40); if(!alive(t)) return; }
        await wait(800); if(!alive(t)) return; $('#h').textContent = 'Ya oyun biterse ve onu bir daha bulamazsan?'; await wait(1500); if(!alive(t)) return; $('#h').textContent = 'Yine de dene.'; pos = 0; step = 1; busy = false; }
    } else if(step === 1){ pos += 3; $('#tt').textContent = target.slice(0, pos); if(pos >= target.length){ step = 2; k.textContent = 'Gönder'; } }
    else { busy = true; k.remove(); $('.typer').remove(); $('#h').remove();
      add(sc, `<div class="b m">${target}</div>`); add(sc, `<div class="silence" id="yz">yazıyor...</div>`); await wait(2000); if(!alive(t)) return; $('#yz').remove();
      add(sc, `<div class="b o">Hiç sormayacaksın sandım.</div>`); await wait(800); if(!alive(t)) return;
      await talk(sc, [['i','Meğer o da bekliyormuş.']]); nextBtn(sc); }
  };
}

/* @@ILKGECE */
N.push('4. İlk gece'); S.push(async () => {
  bg('#2d2440', '#6a4a62');
  const sc = scene(P1, 'WHATSAPP · İLK GECE');
  time(sc, '9 Ocak · 23:03');
  await talk(sc, [['m','Selam :)'],['o','Selam selaam :))'],['m','Yani ben takılıyorum biraz böyle şeylere. Düz olamıyorum.'],['o','İnce bir davranıştı.'],['o','Bunun için teşekkür ederim.'],['o','Yarım kalmaz :):)'],['o','Ben oyunu seviyorum ya, kafa dağıtıyor.'],['m','Ara ara indirdiğim, sonradan sildiğim bir oyundu.'],['m','Ama silemedim sen gelince.'],
    ['i','Sonra kediler.'],['o','Hayvan sever misin?'],['m','Evettt. Kedim var. Sen?'],['o','Oo benim de.'],['note','[bir fotoğraf]'],['o','Emirhan\'la tanış.'],['m','Yaaaa aşırı tatlııı. Yanakları ne öylee'],['o','Allık sürdüm hahaha'],['m','Bu da Araf.'],['o','Çok karizmatik.'],['o','Bizimki hamura benziyor. Toparlak.'],['o','Seninki bildiğin üçgen vücut.'],['i','Gece ilerliyordu.'],['m','Her an “ben yatıyorum” mesajını bekliyorum senden ama.'],['o','Yarın iş yok.'],['o','Kalabilirim biraz daha.']]);
  await talk(sc, [['i','Az ama öz başladı her şey.']]); nextBtn(sc);
});

/* @@KUCUK */
N.push('5. İlk günler'); S.push(async () => {
  bg('#6e4a3a', '#d39a63');
  const sc = scene(P1, 'İLK GÜNLER');
  time(sc, '10 Ocak');
  await talk(sc, [['o','Uyuyakalmışım, özür dilerim. Günaydın.'],['o','Film izleyeceğim. Dün gece yaptığımız çay muhabbetini hatırlayıp işe çay demlemekle başladım.'],['i','Küçük bir cümle. Bütün gün aklından çıkmadı.']]);
  time(sc, '16 Ocak');

  add(ch, `<div class="b o">Yusuf, seni sevmiyorum.</div>`); await wait(1000);
  const ask = add(sc, `<button class="btn ghost">Bir daha sor</button>`), cnt = add(sc, `<div class="note"><span class="count" id="n">1</span>. kez soruyorsun</div>`);
  let n = 1; const rep = ['Seni sevmiyorum dedim.','Çocuk musun Yusuf?','Yeter artık.','Konuşmak istemiyorum.','...'];
  ask.onclick = async e => { e.stopPropagation(); n++; $('#n').textContent = n; add(ch, `<div class="b m s">Ama neden?</div>`);
    if(n <= rep.length + 1) add(ch, `<div class="b o s">${rep[Math.min(n - 2, rep.length - 1)]}</div>`);
    sc.scrollTop = sc.scrollHeight;
    if(n === 7){ ask.remove(); for(let q = 8; q <= 50; q++){ await wait(40); $('#n').textContent = q; }
      await lines(sc, ['Elli kez sordum.', 'Sülük gibi yapıştım. Bunu şimdi görüyorum.']);
      add(ch, `<div class="b m">Hayatının dışında biriymişim gibi hissettiriyor bu.</div>`); await wait(1800);
      add(ch, `<div class="b o">İyi anlamışsın.</div>`); await wait(1500);
      nextBtn(sc, 'Üçüncü kısma geç'); } };
});


/* 15 Kabul */
N.push('24. Kabul'); S.push(async () => {
  bg('#2a2433', '#4a3e5a', .7);
  const sc = scene(P3, 'KABUL');
  await lines(sc, [
    'Şimdi, buraya kadar oynadın.',
    'Beni oynadın. Benim gözümden baktın.',
    'Haklıydın. Akışına bırak dediğinde haklıydın.',
    'Bir ayda bütün bir hayatı kurmaya çalıştım. Seni de yordum, kendimi de.',
    'Kuruntularımla, açıklamalarımla, kıskançlığımla üstüne geldim.',
    'Bir şey daha itiraf edeyim: bu oyunlar da birer bahaneydi.',
    'Seninle konuşmak için. Hep bahane aradım. Bunu biliyorum, sen de biliyorsun.',
    'Bu sonuncusu.'], 'narr');
  nextBtn(sc);
});


/* 16 Aynı kare */
N.push('25. Aynı kare'); S.push(async () => {
  bg('#2b2340', '#6b4e63', .9);
  const sc = scene(P3, 'AYNI KARE', `<div class="together" id="tg"><img class="px" src="${IMG.birlikte}" alt=""></div>`);
  await lines(sc, ['Bütün bu zamanda hiç aynı yerde olmadık.', 'Hep iki ayrı ekranda, iki ayrı şehirdeydik.']);
  $('#tg').classList.add('on'); await wait(2600);
  await lines(sc, ['Belki bir gün, bir kafede, iki kahve.', 'Olabilirdi. Olmadı.', 'Ama böyle hayal etmek de güzeldi.']);

});


/* 18 Son */
N.push('26. Son'); S.push(async () => {
  bg('#1d2a44', '#4a5d80', 1);
  const sc = scene(P3, 'BİR HİKÂYE');
  const sn = document.createElement('div'); sn.className = 'snow';
  sn.innerHTML = Array.from({length:50}, () => `<i style="left:${Math.random()*100}%;animation-duration:${4+Math.random()*4}s;animation-delay:${-Math.random()*6}s"></i>`).join('');
  sc.prepend(sn);
  await lines(sc, ['Bu hikâye bir kar gününde başladı.', 'Kar yine yağacak.', 'Bir akşam bana “Ben olmasam şu an ne yapıyor olurdun?” diye sormuştun.', 'O zaman tam bilmiyordum. Şimdi biliyorum:', 'Seninle o vakitleri geçirmek ne kadar güzelmiş.']);
  await wait(500);
  add(sc, `<div class="final">Bu hikâye bitti mi, bilmiyorum.<br><br>Ama bil ki o vakitler benim için çok güzeldi.</div>`);
  await wait(1800);
  add(sc, `<div class="spacer"></div><div class="big">Günaydın İstanbul.</div><div class="note">— Son —</div>`);
});


function go(){ S[i](); }
document.getElementById('restart').onclick = () => { i = 0; go(); };
go();
</script>
