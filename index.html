<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ne Kadar Tanıyoruz?</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: tek ekranlık kart; krem kağıt, kırmızı tombul başlık, titreyen el çizimi çizgiler */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEECE3;
  --paper-2:#E5E2D6;
  --ink:#1A1A1A;
  --red:#E04E3E;
  --red-ink:#B23526;
  --muted:#6B675C;
  --ok:#2F7A4A;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Poppins','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
#fb{display:flex;justify-content:center}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;max-width:460px;margin:0 auto;box-sizing:border-box;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.back{appearance:none;flex:none;width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s}
.back:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.back:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.count{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#stage{position:relative;flex:1;display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;animation:cardIn .55s cubic-bezier(.25,1.3,.5,1) both}
.card.out{animation:cardOut .28s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateX(-40px) rotate(-2deg)}}
.eyebrow{display:flex;justify-content:space-between;color:var(--red);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;color:var(--red);font-size:clamp(40px,12vw,58px);line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:800;color:var(--red);font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.q{font-size:20px;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.55}
.doodle{display:block;width:100%;max-width:100%;height:150px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .btn{flex:1}
.btn{appearance:none;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:13px 14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .2s,color .2s;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active,.btn.on{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.on{background:var(--red);color:var(--paper)}
.btn.right{background:var(--ok);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--red)}
.btn.primary:hover{box-shadow:5px 5px 0 var(--red)}
.btn:focus-visible,.link:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;align-self:center}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:none}}
.opts .btn:nth-child(2){animation-delay:.06s}.opts .btn:nth-child(3){animation-delay:.12s}.opts .btn:nth-child(4){animation-delay:.18s}.opts .btn:nth-child(5){animation-delay:.24s}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:13px 14px;width:100%;box-sizing:border-box;resize:none}
input::placeholder,textarea::placeholder{color:#9A9585}
.err{color:var(--red-ink);font-size:13px;margin:-4px 0 0;min-height:1em}
.stamp{font-weight:800;display:inline-block;align-self:center;font-family:var(--display);font-size:26px;padding:6px 18px;border:3px solid currentColor;border-radius:10px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.3,1.8,.5,1) both;text-transform:uppercase}
.stamp.good{color:var(--ok)}.stamp.bad{color:var(--red)}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
.note{border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;background:var(--paper-2)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;align-self:flex-start}
/* balon oyunu */
.field{position:relative;height:min(52vh,380px);border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper);touch-action:manipulation}
.balloon{position:absolute;width:56px;height:84px;cursor:pointer;border:0;background:none;padding:0;animation:floatUp linear infinite}
.balloon svg{width:100%;height:100%;overflow:visible}
.balloon .sway{animation:sway 2.2s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes floatUp{from{transform:translateY(420px)}to{transform:translateY(-110px)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.burst{position:absolute;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:8px;height:3px;background:var(--ink);border-radius:2px;left:-4px;top:-1px;animation:shard .5s ease-out forwards}
.burst b{font-weight:800!important;position:absolute;left:-20px;top:-12px;font-family:var(--display);color:var(--red);font-size:18px;font-weight:400;animation:popword .6s ease-out forwards}
@keyframes shard{to{transform:rotate(var(--r)) translateX(34px);opacity:0}}
@keyframes popword{from{transform:scale(.4)}to{transform:translateY(-26px) scale(1.2);opacity:0}}
.score{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
/* harf oyunu */
.word{min-height:58px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding-bottom:8px}
.word span{font-weight:800;line-height:1;font-family:var(--display);font-size:30px;color:var(--red);animation:pop .3s both}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font-weight:800;line-height:1;padding:0;appearance:none;width:48px;height:52px;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,opacity .2s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.tile:nth-child(odd){transform:rotate(-3deg)}.tile:nth-child(even){transform:rotate(2deg)}
.tile.used{animation:tileOut .22s ease-in forwards;pointer-events:none}
@keyframes tileOut{to{transform:scale(0) rotate(12deg);opacity:0;visibility:hidden}}
.tile.back-in{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.icon-btn{flex:none!important;width:52px;padding:0;display:grid;place-items:center}
.word.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.row{display:flex;gap:10px}.row .btn{flex:1}
/* sonuç */
.big{font-weight:800;font-family:var(--display);font-size:64px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:28px;color:var(--muted)}
.meter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:420px){.meter3{grid-template-columns:1fr}}
.meter div{border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.meter span{font-size:12px;color:var(--muted);line-height:1.35}
.meter strong{font-family:var(--display);font-weight:800;font-size:34px;color:var(--red);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink)}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px dashed var(--ink);font-size:14px;line-height:1.45}
.li .k{font-weight:500}
.li .v{color:var(--muted);grid-column:1/2;font-size:13px}
.li .verdict{grid-row:1/3;grid-column:2;align-self:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:2px solid var(--ink);text-align:center;max-width:120px}
.verdict.y{background:var(--ink);color:var(--paper)}
.verdict.n{background:var(--red);color:var(--paper);border-color:var(--red)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.saved{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.owner{border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper-2)}
.owner pre{white-space:pre-wrap;font-family:var(--body);font-size:13px;margin:0;line-height:1.5;overflow-wrap:anywhere}
.wob{filter:url(#boil)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .wob{filter:none}
  .balloon{animation:none}
}

/* ===== piksel sahne teması ===== */
:root{--page:#241d2b;--panel:#2f2838;--paper:#f6efdc;--paper-2:#e9dfc6;--ink:#16120f;--red:#e23b4a;--red-ink:#ff8a94;--muted:#b9b1c8;--ok:#3f9a52;--gold:#f3c94b;--reply:#cfe1f7;--sky:#9fc2ff;
  --display:'Pixelify Sans','Courier New',monospace;--body:'VT323','Courier New',monospace;color-scheme:dark}
body{background:var(--page);color:#f2ead7;font-family:var(--body);font-size:21px}
.app{gap:12px;padding-block:12px 28px}
.doodle{display:none}
.wob{filter:none}
.card{animation:cardIn .35s steps(5) both}
.card.out{animation:cardOut .2s steps(3) both}
h1,h2{font-family:var(--display);font-weight:700;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);letter-spacing:.02em}
h1{font-size:clamp(34px,10vw,46px);line-height:1}
h2{font-size:30px}
.eyebrow{font-family:var(--display);color:var(--sky);font-size:13px;letter-spacing:.08em}
.q{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.45);padding:24px 14px 12px;font-size:24px;line-height:1.05;font-weight:400;margin-top:12px}
.q::before{content:'YUSUF';position:absolute;left:12px;top:5px;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:#6b4bd1}
.q::after{content:'';position:absolute;top:-15px;right:52px;width:16px;height:14px;background:var(--paper);border:3px solid var(--ink);border-bottom:0;clip-path:polygon(0 100%,100% 100%,100% 0)}
.sub{color:var(--muted);font-size:20px;line-height:1.15}
.sub strong{color:#f2ead7;font-weight:400}
.opts{position:relative;padding-top:18px}
.opts::before{content:'SEN';position:absolute;left:2px;top:0;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--sky)}
.btn{font-family:var(--body);font-size:23px;line-height:1;font-weight:400;color:var(--ink);background:var(--reply);border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:10px 12px;animation:pop .3s steps(3) both}
.opts .btn{text-align:left}
.opts.two .btn{text-align:center}
.btn:hover{background:var(--gold);box-shadow:4px 4px 0 rgba(0,0,0,.5);transform:none}
.btn:active,.btn.on{background:var(--gold);color:var(--ink);transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.btn.right{background:var(--ok);color:#fff}
.btn.primary{font-family:var(--display);font-weight:600;font-size:20px;background:var(--gold);color:var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.btn.primary:hover{background:#ffd966;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.btn:focus-visible,.link:focus-visible,.tile:focus-visible,input:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.link{font-family:var(--body);font-size:20px;color:var(--muted)}
input[type=text],textarea{font-family:var(--body);font-size:23px;color:var(--ink);background:var(--reply);border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
input::placeholder{color:#5c6b80}
.err{color:var(--red-ink);font-size:19px}
.note{background:var(--panel);color:#f2ead7;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #4b4258;border-radius:0;font-size:20px;line-height:1.15}
.note strong{color:var(--gold);font-weight:400}
.tag{font-family:var(--display);font-size:11px;background:var(--gold);color:var(--ink);border-radius:0}
.stamp{font-family:var(--display);font-weight:700;background:var(--panel);border-radius:0;font-size:24px}
.stamp.good{color:#7cd36b}.stamp.bad{color:var(--red-ink)}
.top{gap:10px}
.back{border-radius:0;border:3px solid var(--ink);background:var(--reply);box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.bar{height:14px;border:3px solid var(--ink);border-radius:0;background:#1a1620}
.bar i{background:repeating-linear-gradient(90deg,#7cd36b 0 6px,#5fb350 6px 12px);transition:width .4s steps(6)}
.count{font-family:var(--display);font-size:13px;color:#f2ead7}
.field{border:3px solid var(--ink);border-radius:0;background:var(--paper-2);height:min(36vh,300px)}
.score{font-size:20px}
.burst b{font-family:var(--display)}
.word{border-bottom:3px solid #f2ead7}
.word span{font-family:var(--display);color:var(--gold);font-size:32px;text-shadow:2px 2px 0 var(--ink)}
.tile{font-family:var(--display);font-weight:700;font-size:24px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.meter div{background:var(--panel);border:3px solid var(--ink);border-radius:0}
.meter span{color:var(--muted);font-size:17px}
.meter strong{font-family:var(--display);color:var(--gold);font-size:32px}
.list{border-top:3px solid #f2ead7}
.li{border-bottom:2px dashed #5a5266;font-size:20px}
.li .v{color:var(--muted);font-size:18px}
.li .verdict{font-family:var(--display);font-size:10px;border-radius:0;border:2px solid #f2ead7;color:#f2ead7}
.verdict.y{background:#f2ead7;color:var(--ink)}
.verdict.n{background:var(--red);border-color:var(--red);color:#fff}
.saved{color:var(--muted);font-size:18px}
.confetti i{border-radius:0!important;border-width:0}


/* ===== tam ekran oda + karakterler ===== */
:root{--cast:clamp(180px,36vh,290px)}
body{background:#20232c}
.room{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 30px,#1f222b 30px 33px),repeating-linear-gradient(90deg,transparent 0 62px,#1f222b 62px 65px),#2b2f3a}
.room .win{position:absolute;left:6%;top:22%;width:70px;height:92px;background:linear-gradient(#27406b,#41608f 70%,#7d6a8c);border:4px solid #12141a;box-shadow:inset 0 0 0 2px #3b4252}
.room .win::after{content:'';position:absolute;left:31px;top:0;bottom:0;width:4px;background:#12141a}
.room .lamp{position:absolute;right:10%;top:0;width:4px;height:16vh;background:#12141a}
.room .lamp::after{content:'';position:absolute;left:-16px;bottom:-14px;width:36px;height:18px;background:#12141a;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.room .glow{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:140%;height:70vh;background:radial-gradient(ellipse at 50% 100%,rgba(255,214,150,.22),rgba(255,214,150,.06) 45%,transparent 70%)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cast)*.28);background:repeating-linear-gradient(90deg,#4a3a2c 0 40px,#413225 40px 80px);border-top:4px solid #12141a}
.cast{position:fixed;left:0;right:0;bottom:0;z-index:1;height:var(--cast);pointer-events:none;max-width:520px;margin:0 auto}
.app{position:relative;z-index:2;padding-bottom:calc(var(--cast) + 16px)}
.hero{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.hero.hy{left:8%}.hero.hs{right:10%}
.hero .bod{height:100%;display:flex;align-items:flex-end;transform-origin:50% 100%}
.hero img{display:block;height:100%;width:auto;image-rendering:pixelated;filter:drop-shadow(2px 0 0 #0d0f14) drop-shadow(-2px 0 0 #0d0f14) drop-shadow(0 -2px 0 #0d0f14);transform-origin:50% 100%;animation:breathe 1.6s steps(2) infinite}
.hero.hs img{height:91.5%;animation-delay:.8s}
.hero span{position:absolute;bottom:-4px;font-family:var(--display);font-size:10px;letter-spacing:.08em;background:#0d0f14;color:#f2ead7;padding:1px 6px}
@keyframes breathe{50%{transform:scaleY(.985) translateY(1px)}}
.walkin-l .bod{animation:walkL 1.1s steps(6) both}
.walkin-r .bod{animation:walkR 1.1s steps(6) both .15s}
@keyframes walkL{0%{transform:translateX(-60vw) rotate(-3deg)}20%{transform:translateX(-48vw) rotate(3deg)}40%{transform:translateX(-36vw) rotate(-3deg)}60%{transform:translateX(-22vw) rotate(3deg)}80%{transform:translateX(-8vw) rotate(-2deg)}100%{transform:none}}
@keyframes walkR{0%{transform:translateX(60vw) rotate(3deg)}20%{transform:translateX(48vw) rotate(-3deg)}40%{transform:translateX(36vw) rotate(3deg)}60%{transform:translateX(22vw) rotate(-3deg)}80%{transform:translateX(8vw) rotate(2deg)}100%{transform:none}}
.hero.talking .bod{animation:talk .36s steps(2) infinite}
@keyframes talk{0%{transform:rotate(-1.5deg)}100%{transform:rotate(1.5deg) translateY(-2px)}}
.hero.hop .bod{animation:hop .55s steps(4)}
@keyframes hop{40%{transform:translateY(-22px) scaleY(1.03)}70%{transform:translateY(0) scaleY(.96)}}
.hero.nope .bod{animation:nope .6s steps(6)}
@keyframes nope{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.hero.fidget .bod{animation:fidget .8s steps(4)}
@keyframes fidget{30%{transform:translateY(-6px)}60%{transform:translateY(0) scaleX(1.02)}}
.hero.lookl .bod{animation:lookl .9s steps(3)}
@keyframes lookl{50%{transform:skewX(3deg) translateX(-4px)}}
.hero.lookr .bod{animation:lookr .9s steps(3)}
@keyframes lookr{50%{transform:skewX(-3deg) translateX(4px)}}
.lovepop{position:fixed;z-index:3;left:50%;bottom:calc(var(--cast)*.75);width:22px;height:20px;background:var(--red);clip-path:polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 55%,50% 100%,0 55%);animation:love 1.6s steps(8) forwards}
@keyframes love{to{transform:translate(-50%,-80px);opacity:0}}
/* konuşma balonları */
.q{max-width:86%;align-self:flex-start;margin-top:4px}
.q::after{top:auto;bottom:-15px;right:auto;left:26px;border-top:0;border-bottom:3px solid var(--ink);clip-path:polygon(0 0,100% 0,0 100%);border:3px solid var(--ink);border-top:0}
.opts{align-self:flex-end;width:min(78%,340px);align-items:stretch;padding-top:18px;margin-top:6px}
.opts::before{left:auto;right:4px}
.opts.two{flex-direction:column}
.opts .btn{text-align:right;position:relative}
.opts.two .btn{text-align:right}
.btn.dim{opacity:.45}
.cont{align-self:flex-start;width:auto;padding-inline:22px}
.q.say{margin-top:8px}
.opts .btn:last-child::after{content:'';position:absolute;bottom:-15px;right:24px;width:16px;height:14px;background:inherit;border:3px solid var(--ink);border-top:0;clip-path:polygon(0 0,100% 0,100% 100%)}

.card > .btn.primary{align-self:stretch}
.note{background:rgba(31,34,43,.92)}
.list{background:rgba(31,34,43,.94);padding:0 10px;border:3px solid var(--ink);border-top:3px solid #f2ead7}
.saved,.card > p.sub{position:relative}

/* ===== kafe + sahne pozları (önizleme) ===== */
.room{background:#e2c9a6 url(cafe.png) center bottom/cover no-repeat;image-rendering:pixelated}
.room > div{display:none}
.eyebrow{background:rgba(36,29,43,.88);padding:4px 8px;border:2px solid var(--ink)}
.opts::before{background:rgba(36,29,43,.88);padding:1px 5px;top:-2px}
.q::before{color:#6b4bd1}
.pose{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);height:100%;transform:translateX(-50%);display:flex;align-items:flex-end;opacity:0;transition:opacity .8s ease}
.pose.on{opacity:1}
.pose img{height:100%;width:auto;max-width:96vw;object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(2px 0 0 #0d0f14) drop-shadow(-2px 0 0 #0d0f14) drop-shadow(0 -2px 0 #0d0f14);animation:breathe 1.6s steps(2) infinite;transform-origin:50% 100%}
.cast .hero{transition:opacity .8s ease}
.cast.posed .hero{opacity:0}
.pose.hop img{animation:hop .55s steps(4)}
.count{background:rgba(36,29,43,.88);padding:3px 6px;border:2px solid var(--ink)}
.word{background:rgba(36,29,43,.6);padding-inline:8px}

  };

    <div class="eyebrow"><span>Son soru</span><span>Bir kahve</span></div>
    <p class="q">Son bir soru. Uzaktayız, bir süredir de konuşmuyorduk. Bir gün sen orada bir kafeye otursan, ben de burada kahvemi alsam, sonra beni arasan... Benimle bir kahve içer misin?</p>
    ${optsHTML(['Olur, neden olmasın','Belki, ikna et beni','Şimdilik değil'])}
  `, c => {
    const steps = () => {
      say(c, 'Önce yer. Beni hangi kafeden arıyorsun?', () => pickOrWrite(c,
        ['Moda sahilinde, denize bakan bir kafe','Kadıköy çarşıda küçük bir kahveci','Ofisin yakınında sakin bir yer','Evinin yakınında bir kafe'],
        'Başka bir yer (kendim yazayım)', 'Kafenin adı ya da yeri', v => { B.kafe = v;
      say(c, pickOne(['Güzel seçim.','Tam oralık bir yer.','Orayı merak ettim.']) + ' Ne içiyorsun?', () => pickOrWrite(c,
        ['Türk kahvesi','Filtre kahve','Latte','Flat white','Cappuccino','Americano','Mocha','Kahve yerine çay'],
        'Başka bir şey (kendim yazayım)', 'Ne içeceksin?', v => { B.kahve = v;
      say(c, 'Bir de yanına bir şey alıyorsun. Bu kısım zorunlu, kaçış yok.', () => addOpts(c,
        ['San Sebastian cheesecake','Havuçlu tarçınlı kek','Brownie','Tereyağlı kruvasan','Limonlu kek','Çikolatalı kurabiye','Simit'], v => { B.yaninda = v;
      say(c, `“${v}”, iyi tercih. Hangi gün?`, () => addInput(c, {type:'date', min:minDate, btn:'Bu gün', empty:'Bir gün seç.'}, v => { B.tarih = v;
      say(c, `${trDate(v)}. Saat kaçta?`, () => addInput(c, {type:'time', value:'19:00', btn:'Bu saatte', empty:'Bir saat seç.'}, v => { B.saat = v;
        const kart = `${trDate(B.tarih)}, saat ${B.saat}. ${B.kafe}. Sende ${B.kahve} ve ${B.yaninda}.`;
        B.kart = kart; heart();
        say(c, `Tamam, not aldım: ${kart} Ben de o saatte kahvemi alıp bekliyor olacağım. Ararsan açarım.`, () => cont(c, 'Sonuçlara geç'));
      })); })); })); })); }));
    };
    bindOpts(c.querySelector('.opts'), v => {
      B.cevap = v;
      if(v === 'Şimdilik değil'){
        later(() => say(c, 'Anlıyorum, hiç sorun değil. Teklif hep geçerli.', () => cont(c, 'Sonuçlara geç')), 400);
      } else if(v === 'Belki, ikna et beni'){
        later(() => say(c, 'Kahveyi ben ısmarlamış sayalım. Konuşacak konuları da zaten bu oyunda topladık. Ne dersin?', () => addOpts(c, ['Tamam, ikna oldum','Yine de şimdilik değil'], v2 => {
          B.cevap += ' → ' + v2;
          if(v2 === 'Tamam, ikna oldum'){ heart(); later(steps, 400); }
          else later(() => say(c, 'Anlıyorum. Teklif hep geçerli.', () => cont(c, 'Sonuçlara geç')), 400);
        })), 400);
      } else { heart(); later(steps, 400); }
    });
  });
}

/* ---------- sonuç ---------- */
function compute(){
  let tanima = 0, yusufBildi = 0, benzer = 0;
  const rows = PKEYS.map(k => {
    const q = P[k], a = st.p[k] || {};
    const okY = !!q.y && a.guess === q.y; if(okY) tanima++;
    const yKnew = gMatch(q, a.self); if(yKnew) yusufBildi++;
    const same = !!q.y && a.self === q.y; if(same) benzer++;
    const br = q.br && q.br[a.self];
    return {k, label:q.label, guess:a.guess, y:q.y, okY, self:a.self, text:a.text, g:gText(q), yKnew, same,
      d2q: br ? br[0][0] : null, d2: a.d2, d3q: br ? br[1][0] : null, d3: a.d3};
  });
  const unvan = `Benzerlik ${benzer}/${YKEYS.length}`;
  return {tanima, yusufBildi, benzer, unvan, rows};
}

function summaryText(r){
  const L = [];
  L.push('NE KADAR TANIYORUZ');
  L.push('Ne kadar benziyoruz: '+r.benzer+'/'+YKEYS.length);
  L.push('Yusuf\'u tanıma: '+r.tanima+'/'+YKEYS.length);
  L.push('Yusuf beni tanıyor: '+r.yusufBildi+'/'+PKEYS.length);
  L.push('');
  r.rows.forEach(x => {
    L.push(x.label+': Yusuf için '+(x.guess||'-')+' / Ben '+(x.text ? '“'+x.text+'”' : (x.self||'-')));
    if(x.d2) L.push('   '+x.d2q+' '+x.d2);
    if(x.d3) L.push('   '+x.d3q+' '+x.d3);
  });
  L.push('');
  const A = st.a;
  if(A.kitap) L.push('Okuduğum kitap: '+A.kitap);
  if(A.sarki) L.push('Bugün dinlediğim: '+A.sarki);
  if(A.sarkiTahmin) L.push('Yusuf\'un dinlediği (tahminim): '+A.sarkiTahmin);
  if(A.yusufSuAn) L.push('Yusuf şu an: '+A.yusufSuAn);
  if(A.harf) L.push('Harf oyunu: '+A.harf);
  if(A.dil) L.push('Dil: '+A.dil);
  if(A.sabahGorevi) L.push('Sabah görevim: '+A.sabahGorevi);
  if(A.kadikoyGorevi) L.push('Kadıköy görevim: '+A.kadikoyGorevi+(A.kadikoyGoreviYapildi?' (yaptım)':''));
  if(A.minikAktivite) L.push('Minik aktivitem: '+A.minikAktivite);
  if(A.guldugu) L.push('Beni güldüren: '+A.guldugu);
  if(A.kadikoyYer) L.push('Kadıköy\'de en sevdiğim yer: '+A.kadikoyYer);
  if(A.ogrenmek) L.push('Bu ay öğrenmek istediğim: '+A.ogrenmek);
  if(A.yusufaGorev) L.push('Yusuf\'un görevi: '+A.yusufaGorev);
  if(A.foto) L.push('Fotoğraf: '+A.foto);
  if(A.gorevIsim) L.push('Bugünkü kahve adım: '+A.gorevIsim+(A.gorevIsimDurum?' ('+A.gorevIsimDurum+')':''));
  if(A.gorevBulut) L.push('Buluttaki şekil: '+A.gorevBulut);
  if(A.gorevFoto) L.push('Fotoğraf hikâyesi: '+A.gorevFoto);
  if(A.bulusma){ L.push(''); L.push('Kahve: '+A.bulusma.cevap); if(A.bulusma.kart) L.push('Buluşma: '+A.bulusma.kart); }
  return L.join('\n');
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  box.innerHTML = Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;background:${Math.random()<.5?R:'#EEECE3'};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.6}s"></i>`).join('');
  document.body.appendChild(box); setTimeout(()=>box.remove(), 5000);
}

function results(){
  const r = compute();
  const talk = r.rows.filter(x => x.y && x.guess && !x.okY).slice(0, 3);
  show(`
    <div class="eyebrow"><span>Sonuç</span><span>${PKEYS.length} soru</span></div>
    <h1>Ne kadar tanıyoruz?</h1>
    <div class="meter meter3">
      <div><span>Ne kadar benziyoruz</span><strong>${r.benzer}/${YKEYS.length}</strong></div>
      <div><span>Sen beni ne kadar tanıyorsun</span><strong>${r.tanima}/${YKEYS.length}</strong></div>
      <div><span>Ben seni ne kadar tanıyorum</span><strong>${r.yusufBildi}/${PKEYS.length}</strong></div>
    </div>

    <span class="tag">Beni nasıl gördün</span>
    <div class="list">${r.rows.filter(x=>x.y).map(x=>`
      <div class="li"><span class="k">${esc(x.label)}</span>
      <span class="verdict ${x.okY?'y':'n'}">${x.okY?'Aynı':'Farklı'}</span>
      <span class="v">Sen: ${esc(x.guess||'-')} · Ben: ${esc(x.y)}</span></div>`).join('')}
    </div>

    <span class="tag">Seni nasıl görmüşüm</span>
    <div class="list">${r.rows.map(x=>`
      <div class="li"><span class="k">${esc(x.label)}</span>
      <span class="verdict ${x.yKnew?'y':'n'}">${x.yKnew?'Aynı':'Farklı'}</span>
      <span class="v">Sen: ${esc(x.text ? '“'+x.text+'”' : (x.self||'-'))} · Benim tahminim: ${esc(x.g)}</span></div>`).join('')}
    </div>

    ${talk.length?`<span class="tag">Bunu bir konuşalım</span>
    <div class="note">${talk.map(x=>`${esc(x.label)}: sen “${esc(x.guess)}” dedin, ben kendimi “${esc(x.y)}” görüyorum.`).join('<br>')}</div>`:''}

    ${st.a.bulusma && st.a.bulusma.kart?`<span class="tag">Kahve buluşmamız</span><div class="note">${esc(st.a.bulusma.kart)}</div>`:''}
    ${st.a.bulusma && !st.a.bulusma.kart && st.a.bulusma.cevap?`<div class="note">Kahve teklifi hâlâ geçerli.</div>`:''}
    ${st.a.yusufaGorev?`<div class="note">Bana verdiğin zorunlu görev: <strong>${esc(st.a.yusufaGorev)}</strong></div>`:''}
    ${st.a.sarkiTahmin?`<div class="note">Bugün dinlediğim şarkı için tahminin “${esc(st.a.sarkiTahmin)}”. Doğru mu, bana sor.</div>`:''}

    <p class="saved" id="saved">Cevapların kaydediliyor...</p>
    <button class="btn" id="copy">Sonucu kopyala</button>
    <p class="err" id="copyMsg"></p>
    <button class="link" id="again">Baştan oyna</button>
  `, c => {
    confetti();
    $('#barFill').style.width = '100%';
    $('#again',c).onclick = () => { st = {i:-1,sub:0,a:{},p:{},finished:false}; hist.length = 0; render(); };
    const txt = summaryText(r);
    $('#copy',c).onclick = () => {
      const m = $('#copyMsg',c);
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.rows = 8; ta.readOnly = true; m.replaceWith(ta); ta.focus(); ta.select(); };
      try{ navigator.clipboard.writeText(txt).then(()=>{ m.style.color = 'var(--ok)'; m.textContent = 'Kopyalandı. Yusuf\'a yapıştırıp gönderebilirsin.'; }, fallback); }catch(e){ fallback(); }
    };
    save(r, txt, $('#saved',c));
  });
}

async function save(r, txt, el){
  if(st.finished){ el.textContent = 'Cevapların Yusuf\'a ulaştı.'; return; }
  const url = window.SCRIPT_URL;
  const fail = () => { el.textContent = 'Otomatik gönderilemedi. “Sonucu kopyala” ile Yusuf\'a gönderebilirsin.'; };
  if(!url){ fail(); return; }
  try{
    await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
      tanima: r.tanima, yusufBildi: r.yusufBildi, unvan: r.unvan,
      kisisel: r.rows.map(x=>({soru:x.label, yusufIcinTahmin:x.guess, kendiCevabi:x.text ? x.self+': '+x.text : x.self, yusufCevabi:x.y, yusufTahmini:x.g, ayni:x.yKnew, devam:[x.d2?x.d2q+' '+x.d2:null, x.d3?x.d3q+' '+x.d3:null].filter(Boolean)})),
      diger: st.a, ozet: txt
    })});
    st.finished = true;
    el.textContent = 'Cevapların Yusuf\'a ulaştı.';
  }catch(err){ fail(); }
}

/* çizgi titremesi */
let seed = 1; const tb = document.getElementById('tb');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(()=>{ seed = seed%4+1; tb.setAttribute('seed', seed); }, 140);

render();
})();
