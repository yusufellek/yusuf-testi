<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bölümler</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
:root{--ink:#16120f;--paper:#f6efdc;--panel:#2f2838;--gold:#f3c94b;--muted:#b9b1c8;--sky:#cfe1f7;--ok:#3f9a52;--red:#e23b4a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#241d2b;color:var(--paper);font-family:'VT323',monospace;font-size:22px}
.room{position:fixed;inset:0;background:#e2c9a6 url(cafe.png) center bottom/cover no-repeat;image-rendering:pixelated;z-index:0}
.room::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(20,16,24,.55),rgba(20,16,24,.25) 40%,rgba(20,16,24,.7))}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:'Pixelify Sans';font-weight:700;font-size:34px;line-height:1.05;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.sub{margin:0 0 6px;font-size:20px;color:#f2ead7;text-shadow:2px 2px 0 var(--ink)}
.ch{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-decoration:none;color:inherit;background:rgba(31,28,40,.94);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #4b4258,4px 4px 0 rgba(0,0,0,.5);padding:12px}
a.ch:active{transform:translate(3px,3px);box-shadow:inset 0 0 0 2px #4b4258,1px 1px 0 rgba(0,0,0,.5)}
a.ch:hover{background:rgba(47,40,56,.97)}
a.ch:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.num{width:64px;height:64px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:3px solid var(--ink);font-family:'Pixelify Sans';font-weight:700;font-size:13px;line-height:1;text-align:center}
.num b{display:block;font-size:30px}
.t{display:flex;flex-direction:column;gap:3px}
.t strong{font-family:'Pixelify Sans';font-weight:600;font-size:18px;color:#fff}
.t span{font-size:19px;color:var(--muted);line-height:1.05}
.tag{font-style:normal;align-self:flex-start;font-family:'Pixelify Sans';font-size:10px;letter-spacing:.08em;padding:3px 6px;margin-top:3px}
.tag.done{background:#cfcac2;color:var(--ink)}
.tag.new{background:var(--red);color:#fff;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.ch.lock{opacity:.6}
.ch.lock .num{background:#4b4258;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tag.new{animation:none}}
</style>
</head>
<body>
<div class="room" aria-hidden="true"></div>
<main class="wrap">
  <h1>Bölümler</h1>
  

  <a class="ch" href="hafta1.html">
    <div class="num">HAFTA<b>1</b></div>
    <div class="t"><strong>Ne kadar tanıyoruz?</strong><em class="tag done">OYNANDI</em></div>
  </a>

  <a class="ch" href="hafta2.html">
    <div class="num">HAFTA<b>2</b></div>
    <div class="t"><strong>Bir hikâye</strong><em class="tag done">OYNANDI</em></div>
  </a>

  <a class="ch" href="hafta3.html">
    <div class="num">HAFTA<b>3</b></div>
    <div class="t"><strong>Bulutların altında</strong><em class="tag new">YENİ</em></div>
  </a>

  <div class="ch lock" aria-disabled="true">
    <div class="num">HAFTA<b>4</b></div>
    <div class="t"><strong>Yakında</strong></div>
  </div>
</main>
</body>
</html>
