<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yusuf Testi</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: tek ekranlık kart; krem kağıt, kırmızı tombul başlık, titreyen el çizimi çizgiler */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEECE3;
  --paper-2:#E5E2D6;
  --ink:#1A1A1A;
  --red:#E04E3E;
  --red-ink:#B23526;
  --muted:#6B675C;
  --ok:#2F7A4A;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Poppins','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
#fb{display:flex;justify-content:center}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;max-width:460px;margin:0 auto;box-sizing:border-box;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.back{appearance:none;flex:none;width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s}
.back:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.back:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.count{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#stage{position:relative;flex:1;display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;animation:cardIn .55s cubic-bezier(.25,1.3,.5,1) both}
.card.out{animation:cardOut .28s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateX(-40px) rotate(-2deg)}}
.eyebrow{display:flex;justify-content:space-between;color:var(--red);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;color:var(--red);font-size:clamp(40px,12vw,58px);line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:400;color:var(--red);font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.q{font-size:20px;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.55}
.doodle{display:block;width:100%;max-width:100%;height:150px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .btn{flex:1}
.btn{appearance:none;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:13px 14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .2s,color .2s;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active,.btn.on{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.on{background:var(--red);color:var(--paper)}
.btn.right{background:var(--ok);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--red)}
.btn.primary:hover{box-shadow:5px 5px 0 var(--red)}
.btn:focus-visible,.link:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;align-self:center}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:none}}
.opts .btn:nth-child(2){animation-delay:.06s}.opts .btn:nth-child(3){animation-delay:.12s}.opts .btn:nth-child(4){animation-delay:.18s}.opts .btn:nth-child(5){animation-delay:.24s}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:13px 14px;width:100%;box-sizing:border-box;resize:none}
input::placeholder,textarea::placeholder{color:#9A9585}
.err{color:var(--red-ink);font-size:13px;margin:-4px 0 0;min-height:1em}
.stamp{display:inline-block;align-self:center;font-family:var(--display);font-size:26px;padding:6px 18px;border:3px solid currentColor;border-radius:10px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.3,1.8,.5,1) both;text-transform:uppercase}
.stamp.good{color:var(--ok)}.stamp.bad{color:var(--red)}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
.note{border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;background:var(--paper-2)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;align-self:flex-start}
/* balon oyunu */
.field{position:relative;height:min(52vh,380px);border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper);touch-action:manipulation}
.balloon{position:absolute;width:56px;height:84px;cursor:pointer;border:0;background:none;padding:0;animation:floatUp linear infinite}
.balloon svg{width:100%;height:100%;overflow:visible}
.balloon .sway{animation:sway 2.2s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes floatUp{from{transform:translateY(420px)}to{transform:translateY(-110px)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.burst{position:absolute;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:8px;height:3px;background:var(--ink);border-radius:2px;left:-4px;top:-1px;animation:shard .5s ease-out forwards}
.burst b{position:absolute;left:-20px;top:-12px;font-family:var(--display);color:var(--red);font-size:18px;font-weight:400;animation:popword .6s ease-out forwards}
@keyframes shard{to{transform:rotate(var(--r)) translateX(34px);opacity:0}}
@keyframes popword{from{transform:scale(.4)}to{transform:translateY(-26px) scale(1.2);opacity:0}}
.score{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
/* harf oyunu */
.word{min-height:58px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding-bottom:8px}
.word span{font-family:var(--display);font-size:30px;color:var(--red);animation:pop .3s both}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{appearance:none;width:48px;height:52px;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,opacity .2s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.tile:nth-child(odd){transform:rotate(-3deg)}.tile:nth-child(even){transform:rotate(2deg)}
.tile.used{opacity:.2;pointer-events:none}
.row{display:flex;gap:10px}.row .btn{flex:1}
/* sonuç */
.big{font-family:var(--display);font-size:64px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:28px;color:var(--muted)}
.meter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter div{border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.meter span{font-size:12px;color:var(--muted);line-height:1.35}
.meter strong{font-family:var(--display);font-weight:400;font-size:34px;color:var(--red);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink)}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px dashed var(--ink);font-size:14px;line-height:1.45}
.li .k{font-weight:500}
.li .v{color:var(--muted);grid-column:1/2;font-size:13px}
.li .verdict{grid-row:1/3;grid-column:2;align-self:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:2px solid var(--ink);text-align:center;max-width:120px}
.verdict.y{background:var(--ink);color:var(--paper)}
.verdict.n{background:var(--red);color:var(--paper);border-color:var(--red)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.saved{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.owner{border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper-2)}
.owner pre{white-space:pre-wrap;font-family:var(--body);font-size:13px;margin:0;line-height:1.5;overflow-wrap:anywhere}
.wob{filter:url(#boil)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .wob{filter:none}
  .balloon{animation:none}
}
</style>
</head>

    <div class="count" id="count"></div>

</div>

/* ---------- durum ---------- */
let st = {i:-1, sub:0, a:{}, p:{}, finished:false};
const stage = $('#stage');

function setProgress(){
  const top = $('#top');
  if(st.i < 0 || st.i >= STEPS.length){ top.hidden = true; return; }
  top.hidden = false;
  $('#barFill').style.width = ((st.i)/STEPS.length*100)+'%';
  $('#count').textContent = (st.i+1)+' / '+STEPS.length;
}

function show(html, after){
  const old = stage.firstElementChild;
  const put = () => {
    stage.innerHTML = `<div class="card">${html}</div>`;
    setProgress();
    window.scrollTo({top:0,behavior:'smooth'});
    after && after(stage.firstElementChild);
  };
  if(old){ old.classList.add('out'); setTimeout(put, 260); } else put();
}

const hist = [];
let viewId = 0;
const later = (fn, ms) => { const v = viewId; setTimeout(() => { if(v === viewId) fn(); }, ms); };
function next(){ hist.push({i:st.i, sub:st.sub}); st.sub = 0; st.i++; render(); }
function advSub(n){ hist.push({i:st.i, sub:st.sub}); st.sub = n; render(); }
function back(){
  if(!hist.length) return;
  const p = hist.pop(); st.i = p.i; st.sub = p.sub;
  const s = STEPS[st.i];
  if(s){
    if(s.t === 'p' && st.sub === 0 && st.p[s.k]) delete st.p[s.k].guess;
    if(s.t === 'lang') delete st.a.dil;
    if(s.t === 'pick'){ delete st.a[s.k]; delete st.a[s.k+'Yapildi']; }
  }
  render();
}
document.getElementById('backBtn').onclick = back;
function render(){
  viewId++;
  $('#backBtn').hidden = !(st.i >= 0 && st.i < STEPS.length && hist.length);
  if(st.i < 0) return intro();
  if(st.i >= STEPS.length) return results();
  const s = STEPS[st.i];
  ({balloons, p:personal, text:textStep, letters, lang, pick, photo})[s.t](s);
}

function personal(s){
  const q = P[s.k];
  const ans = st.p[s.k] || (st.p[s.k] = {});
  const many = q.o.length > 2;
  if(q.noY && st.sub === 0) st.sub = 1;
  if(st.sub === 0){
    show(`
      <div class="eyebrow"><span>Yusuf hakkında</span><span>Tahmin</span></div>
      ${doodle(q.d)}
      <p class="q">${esc(q.yq)}</p>
      <div class="opts ${many?'':'two'}">${q.o.map(o=>`<button class="btn" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>
    `, c => {
      c.querySelectorAll('.btn').forEach(b => b.onclick = () => {
        if(ans.guess) return;
        ans.guess = b.dataset.v;
        const ok = ans.guess === q.y;
        b.classList.add(ok ? 'right' : 'on');
        if(!ok) c.querySelectorAll('.btn').forEach(x => { if(x.dataset.v === q.y) x.classList.add('right'); });
        $('#fb',c).innerHTML = `<div class="stamp ${ok?'good':'bad'}">${ok?'Bildin':'Bilemedin'}</div>`;
        later(()=>advSub(1), 1300);
      });
    });
  } else if(st.sub === 1){
    show(`
      <div class="eyebrow"><span>Senin hakkında</span><span>${esc(q.label)}</span></div>
      <p class="q">${esc(q.noY ? q.aq : q.sq)}</p>${q.noY?doodle(q.d):''}
      <div class="opts ${q.so.length>2?'':'two'}">${q.so.map(o=>`<button class="btn" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    `, c => {
      c.querySelectorAll('.btn').forEach(b => b.onclick = () => {
        ans.self = b.dataset.v; b.classList.add('on');
        later(()=>advSub(2), 350);
      });
    });
  } else {
    show(`
      <div class="eyebrow"><span>Senin hakkında</span><span>${esc(q.label)}</span></div>
      <p class="q">Sence Yusuf bunu biliyor mu?</p>
      <p class="sub">Senin cevabın: <strong>${esc(ans.self)}</strong></p>
      <div class="opts two"><button class="btn" data-v="Bilir">Bilir</button><button class="btn" data-v="Bilmez">Bilmez</button></div>
      <p class="sub">Doğrusunu oyunun sonunda göreceksin.</p>
    `, c => {
      c.querySelectorAll('.btn').forEach(b => b.onclick = () => {
        ans.knows = b.dataset.v; b.classList.add('on');
        later(next, 350);
      });
    });
  }
}

function balloons(){
  const N = 18;
  show(`
    <div class="eyebrow"><span>Isınma turu</span><span></span></div>
    <h2>Önce şunları bir patlat</h2>
    <div class="field" id="field" aria-label="Balon alanı"></div>
    <div class="score"><span id="left">${N} balon kaldı</span><span id="time">0,0 sn</span></div>
  `, c => {
    const f = $('#field',c); let left = N; const t0 = performance.now();
    const vb = viewId;
    const timer = setInterval(()=>{ if(vb !== viewId){ clearInterval(timer); return; } $('#time',c).textContent = ((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' sn'; }, 100);
    for(let n=0;n<N;n++){
      const b = document.createElement('button');
      b.className = 'balloon'; b.setAttribute('aria-label','Balonu patlat');
      const red = Math.random() < .45;
      b.innerHTML = `<svg viewBox="0 0 56 84" class="sway" style="animation-delay:${-Math.random()*2}s"><g ${S}><ellipse cx="28" cy="28" rx="${18+Math.random()*4}" ry="24" fill="${red?R:'#EEECE3'}"/><path d="M24 52l4 5 4-5M28 57q-6 12 2 25"/><path d="M19 18q3-6 9-7"/></g></svg>`;
      b.style.left = (4 + Math.random()*78)+'%';
      b.style.animationDuration = (5 + Math.random()*4)+'s';
      b.style.animationDelay = (-Math.random()*8)+'s';
      b.onclick = e => {
        const r = f.getBoundingClientRect(), br = b.getBoundingClientRect();
        const burst = document.createElement('div'); burst.className = 'burst';
        burst.style.left = (br.left - r.left + br.width/2)+'px'; burst.style.top = (br.top - r.top + 26)+'px';
        const words = ['PAT','POF','ÇAT','BAM'];
        burst.innerHTML = Array.from({length:8},(_,k)=>`<i style="--r:${k*45}deg;transform:rotate(${k*45}deg)"></i>`).join('') + `<b>${words[Math.floor(Math.random()*4)]}</b>`;
        f.appendChild(burst); setTimeout(()=>burst.remove(), 650);
        b.remove(); left--;
        $('#left',c).textContent = left ? left+' balon kaldı' : 'Hepsi patladı';
        if(!left){
          clearInterval(timer);
          st.a.balonSure = ((performance.now()-t0)/1000).toFixed(1);
          setTimeout(()=>{
            $('#left',c).textContent = st.a.balonSure.replace('.',',')+' saniyede bitirdin';
            later(next, 900);
          }, 300);
        }
      };
      f.appendChild(b);
    }
  });
}

function letters(){
  const pool = LETTERS.map((l,i)=>({l,i})).sort(()=>Math.random()-.5);
  let word = [];
  show(`
    <div class="eyebrow"><span>Harf oyunu</span><span></span></div>
    ${doodle('tiles')}
    <p class="q">Bu harflerle yazabildiğin en uzun kelimeyi yaz</p>
    <div class="word" id="word" aria-live="polite"></div>
    <div class="tiles" id="tiles">${pool.map(p=>`<button class="tile" data-i="${p.i}">${p.l}</button>`).join('')}</div>
    <p class="err" id="err"></p>
    <div class="row"><button class="btn" id="back">Sil</button><button class="btn primary" id="ok">Bitti</button></div>
  `, c => {
    const draw = () => { $('#word',c).innerHTML = word.map(w=>`<span>${w.l}</span>`).join(''); };
    c.querySelectorAll('.tile').forEach(t => t.onclick = () => { word.push({l:t.textContent,el:t}); t.classList.add('used'); $('#err',c).textContent=''; draw(); });
    $('#back',c).onclick = () => { const w = word.pop(); if(w) w.el.classList.remove('used'); draw(); };
    $('#ok',c).onclick = () => {
      if(word.length < 2){ $('#err',c).textContent = 'En az iki harflik bir kelime kur.'; return; }
      const w = word.map(x=>x.l).join(''); st.a.harf = w;
      const best = w === 'ARKADAŞLIK';
      c.innerHTML = `<div class="eyebrow"><span>Harf oyunu</span><span></span></div>
        <h2>${esc(w)}</h2>
        <p class="q">${w.length} harf.</p>
        <div class="note">${best ? 'Tam isabet, bütün harfleri kullandın.' : 'Bu harflerin hepsiyle tek bir kelime çıkıyordu: <strong>ARKADAŞLIK</strong>.'}</div>
        <button class="btn primary" id="n">Devam</button>`;
      $('#n',c).onclick = next;
    };
  });
}

function lang(){
  const pickL = LANGS[Math.floor(Math.random()*LANGS.length)];
  const others = LANGS.filter(l=>l!==pickL).sort(()=>Math.random()-.5).slice(0,3).map(l=>l[1]);
  const opts = [pickL[1], ...others].sort(()=>Math.random()-.5);
  show(`
    <div class="eyebrow"><span>Dil sorusu</span><span>${esc(pickL[0])}</span></div>
    ${doodle('globe')}
    <p class="q">${esc(pickL[0])}'da “merhaba” nasıl denir?</p>
    <div class="opts">${opts.map(o=>`<button class="btn" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
  `, c => {
    c.querySelectorAll('.opts .btn').forEach(b => b.onclick = () => {
      if(st.a.dil) return;
      const ok = b.dataset.v === pickL[1];
      st.a.dil = pickL[0]+': '+(ok?'bildi':'bilemedi');
      b.classList.add(ok?'right':'on');
      c.querySelectorAll('.opts .btn').forEach(x=>{ if(x.dataset.v===pickL[1]) x.classList.add('right'); });
      const fb = $('#fb',c);
      if(ok){
        fb.innerHTML = `<div class="note" style="margin-top:4px">Bu dili iyi biliyor gibisin. Oyuna ${esc(pickL[0])} devam edelim mi?</div><div class="row" style="margin-top:10px"><button class="btn" id="y">Evet</button><button class="btn" id="n">Hayır</button></div>`;
        $('#y',c).onclick = () => { fb.innerHTML = `<div class="note">Harika. Yalnız oyunun geri kalanı bu dili bilmiyor, o yüzden Türkçe devam ediyoruz.</div><button class="btn primary" id="go" style="margin-top:10px">Tamam</button>`; $('#go',c).onclick = next; };
        $('#n',c).onclick = next;
      } else {
        fb.innerHTML = `<div class="stamp bad">${esc(pickL[1])}</div><button class="btn primary" id="go" style="margin-top:14px">Bir dahakine</button>`;
        $('#go',c).onclick = next;
      }
    });
  });
}

/* ---------- sonuç ---------- */
function compute(){
  let tanima = 0, yusufBildi = 0, tahminTuttu = 0;
  const rows = PKEYS.map(k => {
    const q = P[k], a = st.p[k] || {};
    const okY = !q.noY && a.guess === q.y; if(okY) tanima++;
    const yKnew = q.g === a.self; if(yKnew) yusufBildi++;
    const said = a.knows;
    let verdict;
    if(said === 'Bilir') verdict = yKnew ? 'Haklıymışsın, biliyormuş' : 'Aslında bilmiyormuş';
    else verdict = yKnew ? 'Aslında biliyormuş' : 'Haklıymışsın, bilmiyormuş';
    if((said==='Bilir') === yKnew) tahminTuttu++;
    return {k, noY:!!q.noY, label:q.label, guess:a.guess, y:q.y, okY, self:a.self, g:q.g, yKnew, said, verdict};
  });
  const pct = Math.round(tanima/YKEYS.length*100);
  const unvan = pct>=85 ? 'Yusuf\'u Yusuf\'tan iyi tanıyor' : pct>=60 ? 'Yusuf uzmanı' : pct>=30 ? 'Tanıdık bir sima' : 'Yusuf kim?';
  return {tanima, yusufBildi, tahminTuttu, pct, unvan, rows};
}

function summaryText(r){
  const L = [];
  L.push('YUSUF TESTİ SONUCU');
  L.push('Yusuf\'u tanıma: '+r.tanima+'/'+YKEYS.length+' ('+r.unvan+')');
  L.push('Yusuf beni tanıyor: '+r.yusufBildi+'/'+PKEYS.length);
  L.push('');
  r.rows.forEach(x => L.push(x.label+': '+(x.noY?'':'Yusuf için '+x.guess+' / ')+'Ben '+x.self+' / '+x.said+' dedim'));
  L.push('');
  const A = st.a;
  if(A.kitap) L.push('Okuduğum kitap: '+A.kitap);
  if(A.sarki) L.push('Bugün dinlediğim: '+A.sarki);
  if(A.sarkiTahmin) L.push('Yusuf\'un dinlediği (tahminim): '+A.sarkiTahmin);
  if(A.yusufSuAn) L.push('Yusuf şu an: '+A.yusufSuAn);
  if(A.harf) L.push('Harf oyunu: '+A.harf);
  if(A.dil) L.push('Dil: '+A.dil);
  if(A.balonSure) L.push('Balonlar: '+A.balonSure+' sn');
  if(A.sabahGorevi) L.push('Sabah görevim: '+A.sabahGorevi);
  if(A.kadikoyGorevi) L.push('Kadıköy görevim: '+A.kadikoyGorevi+(A.kadikoyGoreviYapildi?' (yaptım)':''));
  if(A.minikAktivite) L.push('Minik aktivitem: '+A.minikAktivite);
  if(A.yusufaGorev) L.push('Yusuf\'un görevi: '+A.yusufaGorev);
  if(A.isAn) L.push('İşte en sevdiğim an: '+A.isAn);
  if(A.guldugu) L.push('Beni güldüren: '+A.guldugu);
  if(A.kadikoyYer) L.push('Kadıköy\'de en sevdiğim yer: '+A.kadikoyYer);
  if(A.haftasonu) L.push('İdeal hafta sonu sabahı: '+A.haftasonu);
  if(A.ogrenmek) L.push('Bu ay öğrenmek istediğim: '+A.ogrenmek);
  if(A.enerji) L.push('Bana enerji veren: '+A.enerji);
  if(A.foto) L.push('Fotoğraf: '+A.foto);
  return L.join('\n');
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  box.innerHTML = Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;background:${Math.random()<.5?R:'#EEECE3'};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.6}s;border-radius:${Math.random()<.4?'50%':'2px'}"></i>`).join('');
  document.body.appendChild(box); setTimeout(()=>box.remove(), 5000);
}

function results(){
  const r = compute();
  const notKnown = r.rows.filter(x=>!x.yKnew);
  show(`
    <div class="eyebrow"><span>Sonuç</span><span>${PKEYS.length} kişisel soru</span></div>
    <h1>${esc(r.unvan)}</h1>
    ${doodle('trophy')}
    <div class="meter">
      <div><span>Yusuf'u ne kadar tanıyorsun</span><strong>${r.tanima}/${YKEYS.length}</strong></div>
      <div><span>Yusuf seni ne kadar tanıyor</span><strong>${r.yusufBildi}/${PKEYS.length}</strong></div>
    </div>
    <p class="sub">Yusuf hakkındaki “bilir, bilmez” tahminlerinden ${r.tahminTuttu} tanesi tuttu.</p>

    <span class="tag">Yusuf seni biliyor muymuş</span>
    <div class="list">${r.rows.map(x=>`
      <div class="li"><span class="k">${esc(x.label)}</span>
      <span class="verdict ${x.yKnew?'y':'n'}">${esc(x.verdict)}</span>
      <span class="v">Sen: ${esc(x.self)} · Yusuf'un tahmini: ${esc(x.g)} · Sen “${esc(x.said)}” dedin</span></div>`).join('')}
    </div>

    ${notKnown.length?`<span class="tag">Yusuf'un bilmediği şeyler</span>
    <div class="note">${notKnown.map(x=>`${esc(x.label)}: <strong>${esc(x.self)}</strong>`).join('<br>')}</div>`:''}

    <span class="tag">Senin Yusuf tahminlerin</span>
    <div class="list">${r.rows.filter(x=>!x.noY).map(x=>`
      <div class="li"><span class="k">${esc(x.label)}</span>
      <span class="verdict ${x.okY?'y':'n'}">${x.okY?'Bildin':'Bilemedin'}</span>
      <span class="v">Senin tahminin: ${esc(x.guess)} · Doğrusu: ${esc(x.y)}</span></div>`).join('')}
    </div>

    ${st.a.yusufaGorev?`<div class="note">Yusuf'un bugünkü zorunlu görevi: <strong>${esc(st.a.yusufaGorev)}</strong></div>`:''}
    ${st.a.sarkiTahmin?`<div class="note">Yusuf'un bugün dinlediği şarkı için tahminin “${esc(st.a.sarkiTahmin)}”. Teyit için ona sor.</div>`:''}

    <p class="saved" id="saved">Cevapların kaydediliyor...</p>
    <button class="btn" id="copy">Sonucu kopyala</button>
    <p class="err" id="copyMsg"></p>
    <button class="link" id="again">Baştan oyna</button>
  `, c => {
    confetti();
    $('#barFill').style.width = '100%';
    $('#again',c).onclick = () => { st = {i:-1,sub:0,a:{},p:{},finished:false}; hist.length = 0; render(); };
    const txt = summaryText(r);
    $('#copy',c).onclick = () => {
      const m = $('#copyMsg',c);
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.rows = 8; ta.readOnly = true; m.replaceWith(ta); ta.focus(); ta.select(); };
      try{ navigator.clipboard.writeText(txt).then(()=>{ m.style.color = 'var(--ok)'; m.textContent = 'Kopyalandı. Yusuf\'a yapıştırıp gönderebilirsin.'; }, fallback); }catch(e){ fallback(); }
    };
    save(r, txt, $('#saved',c));
  });
}

async function save(r, txt, el){
  if(st.finished){ el.textContent = 'Cevapların Yusuf\'a ulaştı.'; return; }
  const url = window.SCRIPT_URL;
  const fail = () => { el.textContent = 'Otomatik gönderilemedi. “Sonucu kopyala” ile Yusuf\'a gönderebilirsin.'; };
  if(!url){ fail(); return; }
  try{
    await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
      tanima: r.tanima, yusufBildi: r.yusufBildi, unvan: r.unvan,
      kisisel: r.rows.map(x=>({soru:x.label, yusufIcinTahmin:x.guess, kendiCevabi:x.self, yusufBilirMi:x.said})),
      diger: st.a, ozet: txt
    })});
    st.finished = true;
    el.textContent = 'Cevapların Yusuf\'a ulaştı.';
  }catch(err){ fail(); }
}

/* çizgi titremesi */
let seed = 1; const tb = document.getElementById('tb');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(()=>{ seed = seed%4+1; tb.setAttribute('seed', seed); }, 140);

render();
})();
